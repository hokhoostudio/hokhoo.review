<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Minimal Floral Space</title>
  <meta name="theme-color" content="#f6f9f5" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Colors inspired by the floral image */
      --color-bg: #f6f9f5;
      --color-green-light: #e4f0de;
      --color-pink-light: #fbe0e6;
      --color-blue-light: #e6eff7;
      --color-yellow-light: #fef5d8;
      --text-main: #4a5348;
      --text-muted: #8c9689;
      --white: #ffffff;
      --border: 1px solid rgba(200, 210, 195, 0.4);
      --shadow-soft: 0 8px 24px rgba(110, 130, 105, 0.06);
      --shadow-hover: 0 12px 32px rgba(110, 130, 105, 0.12);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, #f3f8f1 0%, #fcf4f6 50%, #f1f6fa 100%);
      display: flex;
      justify-content: center;
      padding: 20px 12px 40px;
    }

    .phone {
      width: min(100%, 420px);
      min-height: 100vh;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      border: var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04);
      border-radius: 32px;
      overflow: hidden;
      position: relative;
    }

    .deco-circle-1 {
      position: absolute; top: -50px; left: -50px; width: 200px; height: 200px;
      background: var(--color-pink-light); border-radius: 50%; filter: blur(40px); z-index: 0; opacity: 0.6;
    }
    .deco-circle-2 {
      position: absolute; top: 100px; right: -80px; width: 250px; height: 250px;
      background: var(--color-green-light); border-radius: 50%; filter: blur(50px); z-index: 0; opacity: 0.5;
    }

    .content { position: relative; z-index: 1; padding: 24px 20px 32px; }
    
    .header { padding: 30px 4px 24px; text-align: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      background: var(--white); border: var(--border); border-radius: 999px;
      font-size: 11px; font-weight: 500; color: #a47683; text-transform: uppercase; letter-spacing: 0.5px;
    }
    h1 {
      margin: 16px 0 8px; font-size: 24px; font-weight: 600; line-height: 1.3; color: #3b4239;
    }
    .sub { margin: 0 0 24px; color: var(--text-muted); font-size: 13px; font-weight: 300; }

    .search {
      display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.6);
      padding: 0 16px; height: 44px; border-radius: 12px; border: var(--border);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .search:focus-within { background: var(--white); box-shadow: var(--shadow-soft); border-color: var(--color-green-light); }
    .search input { width: 100%; border: 0; outline: 0; font: inherit; color: var(--text-main); background: transparent; }
    .search input::placeholder { color: #aeb5ab; font-weight: 300; }
    
    button { font: inherit; border: 0; cursor: pointer; }
    .admin-toggle {
      position: absolute; top: 16px; right: 16px; z-index: 20;
      height: 38px; width: 38px; border-radius: 12px; background: rgba(255,255,255,0.8);
      box-shadow: var(--shadow-soft); color: #8c9689; border: var(--border); font-size: 14px;
    }

    .section-title {
      display: flex; align-items: center; justify-content: space-between; margin: 24px 4px 16px;
    }
    .section-title strong { font-size: 15px; font-weight: 600; color: #4a5348; }
    .count { font-size: 11px; color: var(--text-muted); font-weight: 400; background: var(--white); padding: 4px 10px; border-radius: 999px; border: var(--border); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .card {
      background: rgba(255, 255, 255, 0.9); border-radius: 16px; overflow: hidden; border: var(--border);
      box-shadow: var(--shadow-soft); transition: all 0.3s ease; position: relative; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    
    .product-code {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px);
      padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; color: #6a7566;
      border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .image-wrap { aspect-ratio: 1; position: relative; overflow: hidden; background: var(--color-green-light); }
    .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #a4b39e; background: #eef5eb; }
    
    .card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
    .name { font-weight: 500; font-size: 13px; margin-bottom: 8px; line-height: 1.4; color: #3b4239; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; flex: 1; }
    .tag { font-size: 10px; padding: 4px 8px; border-radius: 6px; background: var(--color-bg); color: #758071; font-weight: 400; border: var(--border); }
    
    .action-btn {
      width: 100%; min-height: 36px; border-radius: 10px; background: #5c635a;
      color: var(--white); font-weight: 500; font-size: 12px; display: flex; justify-content: center; align-items: center; gap: 6px;
      transition: background 0.2s;
    }
    .action-btn:hover { background: #4a5348; }

    .add-card-btn {
      display: none; border: 1px dashed #c0ccc1; border-radius: 16px; background: rgba(255,255,255,0.5);
      align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #8c9689; font-size: 13px; cursor: pointer; min-height: 200px;
    }
    .admin-mode .add-card-btn { display: flex; }
    .add-card-btn:hover { background: rgba(255,255,255,0.8); border-color: #8c9689; color: #5c635a; }

    .empty { grid-column: 1/-1; text-align: center; padding: 40px 15px; color: var(--text-muted); background: var(--white); border: 1px dashed #dce3d9; border-radius: 16px; font-weight: 300; }
    
    .footer { text-align: center; color: #a8b0a5; font-size: 11px; margin-top: 40px; padding-bottom: 10px; font-weight: 300; }

    /* Admin UI */
    .admin-mode [data-editable] {
      position: relative; outline: 1px dashed #8ba388; outline-offset: 4px; cursor: pointer; border-radius: 4px; transition: 0.2s;
    }
    .admin-mode [data-editable]:hover { outline-color: #5c635a; background: rgba(139, 163, 136, 0.1); }
    
    .admin-mode .card { cursor: pointer; outline: 2px dashed #8ba388; outline-offset: 2px; }
    .admin-mode .card::after {
      content: "✏️ แตะเพื่อแก้ไข"; position: absolute; inset: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #4a5348; opacity: 0; transition: 0.2s; z-index: 10;
    }
    .admin-mode .card:hover::after { opacity: 1; }
    .admin-mode .action-btn { pointer-events: none; }

    /* Modals */
    .modal {
      position: fixed; inset: 0; background: rgba(240, 244, 239, 0.8); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: min(100%, 380px); max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 24px; padding: 24px;
      box-shadow: 0 24px 60px rgba(60, 70, 55, 0.1); border: var(--border);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-head strong { font-size: 16px; font-weight: 600; color: #3b4239; }
    .close { width: 32px; height: 32px; border-radius: 10px; background: #f6f9f5; color: #8c9689; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    
    .form { display: grid; gap: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 500; margin: 0 0 6px 4px; color: #6a7566; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #dce3d9; background: #fcfdfc; border-radius: 12px; padding: 12px 14px;
      outline: 0; font: inherit; color: var(--text-main); transition: 0.2s; font-size: 13px;
    }
    .field input:focus, .field textarea:focus { border-color: #8ba388; background: var(--white); box-shadow: 0 0 0 3px rgba(139,163,136,0.1); }
    .field textarea { min-height: 80px; resize: vertical; }
    
    /* Password field with toggle */
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 44px; }
    .toggle-password {
      position: absolute; right: 12px; background: transparent; border: none; font-size: 16px; 
      color: #8c9689; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
    }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .save-btn { background: #5c635a; color: var(--white); border-radius: 12px; padding: 12px; font-weight: 500; font-size: 13px; }
    .delete-btn { background: #feeef0; color: #c46370; border-radius: 12px; padding: 12px; font-weight: 500; font-size: 13px; }
    
    .toast {
      position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px); background: #3b4239; color: white;
      border-radius: 999px; padding: 10px 20px; font-size: 12px; opacity: 0; pointer-events: none; transition: .3s ease; z-index: 200;
      box-shadow: 0 10px 24px rgba(0,0,0,.15); font-weight: 400;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media(max-width:360px){.grid{gap:12px} h1{font-size:22px}}
    @media(min-width:700px){body{padding-top:40px}.phone{min-height:auto}}
  </style>
</head>
<body>
  <main class="phone" id="phone">
    <div class="deco-circle-1"></div>
    <div class="deco-circle-2"></div>
    
    <button id="adminToggle" class="admin-toggle" title="เข้าสู่โหมดแอดมิน">⚙️</button>
    
    <div class="content">
      <header class="header">
        <div class="eyebrow" data-editable="eyebrow"></div>
        <h1 data-editable="title"></h1>
        <p class="sub" data-editable="subtitle"></p>
        
        <div class="search">
          <span data-editable="searchIcon"></span>
          <input id="searchInput" type="search" />
        </div>
      </header>

      <div class="section-title">
        <strong data-editable="sectionTitle"></strong>
        <span id="count" class="count">0</span>
      </div>

      <section class="grid">
        <div id="cardsGrid" style="display: contents;"></div>
        <div id="addCardBtn" class="add-card-btn" onclick="openCardModal()">
          <div style="font-size: 24px;">+</div>
          <div>เพิ่มสินค้าใหม่</div>
        </div>
      </section>

      <div class="footer" data-editable="footer"></div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="passwordModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <strong>เข้าสู่โหมดผู้ดูแล</strong>
        <button class="close" onclick="closeModal('passwordModal')">✕</button>
      </div>
      <form id="passwordForm" class="form">
        <div class="field">
          <label>รหัสผ่าน</label>
          <div class="password-wrapper">
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน">
            <button type="button" id="togglePassword" class="toggle-password" title="แสดงรหัสผ่าน">👁️</button>
          </div>
        </div>
        <button class="save-btn" type="submit" style="grid-column: 1 / -1; margin-top: 6px;">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>

  <!-- Text Edit Modal -->
  <div id="textEditModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="textModalTitle">แก้ไขข้อความ</strong>
        <button class="close" onclick="closeModal('textEditModal')">✕</button>
      </div>
      <form id="textEditForm" class="form">
        <div class="field">
          <label id="textModalLabel">ข้อความ</label>
          <input id="textInput">
        </div>
        <button class="save-btn" type="submit" style="grid-column: 1 / -1; margin-top: 6px;">บันทึก</button>
      </form>
    </div>
  </div>

  <!-- Product/Card Edit Modal -->
  <div id="cardEditModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="cardModalTitle">เพิ่ม/แก้ไขสินค้า</strong>
        <button class="close" onclick="closeModal('cardEditModal')">✕</button>
      </div>
      <form id="cardForm" class="form">
        <input type="hidden" id="cardId">
        <div class="field">
          <label>รหัสสินค้า</label>
          <input id="cardCode" placeholder="เช่น FL-001">
        </div>
        <div class="field">
          <label>ชื่อสินค้า / สถานที่</label>
          <input id="cardName" required placeholder="ชื่อสินค้า">
        </div>
        <div class="field">
          <label>ลิงก์รูปภาพ</label>
          <input id="cardImage" type="url" placeholder="https://...jpg / png">
        </div>
        <div class="field">
          <label>ลิงก์ปลายทาง (สั่งซื้อ/แผนที่)</label>
          <input id="cardLink" type="url" required placeholder="https://...">
        </div>
        <div class="field">
          <label>หมวดหมู่ / แท็ก (คั่นด้วยเว้นวรรค)</label>
          <textarea id="cardTags" placeholder="#ดอกไม้ #มินิมอล"></textarea>
        </div>
        <div class="btn-row">
          <button type="submit" class="save-btn">บันทึกข้อมูล</button>
          <button type="button" id="deleteCardBtn" class="delete-btn" style="display:none;" onclick="deleteCard()">ลบสินค้านี้</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const DATA_KEY = "minimal_floral_cards_v1";
const PAGE_KEY = "minimal_floral_page_v1";

const defaults = {
  eyebrow: "✧ NEW ARRIVAL",
  title: "Minimal Floral",
  subtitle: "คอลเลกชันใหม่ แรงบันดาลใจจากธรรมชาติ",
  searchIcon: "⚲",
  searchPlaceholder: "ค้นหารหัสสินค้า, ชื่อ หรือแท็ก...",
  sectionTitle: "สินค้าทั้งหมด",
  actionButton: "ดูรายละเอียด",
  footer: "Minimal Floral Design • 2026"
};

const sampleData = [
  {id: uid(), code: "FL-001", name: "Pastel Spring Bloom", image: "https://images.unsplash.com/photo-1558227976-59146603aeb2?auto=format&fit=crop&w=800&q=80", link: "#", tags: ["#ดอกไม้", "#สปริง"]},
  {id: uid(), code: "FL-002", name: "Soft Morning Grass", image: "https://images.unsplash.com/photo-1500389679632-159489f0761e?auto=format&fit=crop&w=800&q=80", link: "#", tags: ["#ต้นไม้", "#มินิมอล"]}
];

function uid() { return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()); }
function read(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch(e) { return fallback; } }

let items = read(DATA_KEY, sampleData);
let page = { ...defaults, ...read(PAGE_KEY, {}) };
let adminMode = false;
let currentTextKey = null;

const $ = id => document.getElementById(id);

function saveItems() { localStorage.setItem(DATA_KEY, JSON.stringify(items)); }
function savePage() { localStorage.setItem(PAGE_KEY, JSON.stringify(page)); }
function esc(s = "") { return String(s).replace(/[&<>"']/g, m => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"}[m])); }
function closeModal(id) { $(id).classList.remove('show'); }

// --- อัปเดตข้อมูลหน้าเว็บ ---
function applyPageData() {
  document.querySelector('[data-editable="eyebrow"]').textContent = page.eyebrow;
  document.querySelector('[data-editable="title"]').textContent = page.title;
  document.querySelector('[data-editable="subtitle"]').textContent = page.subtitle;
  document.querySelector('[data-editable="searchIcon"]').textContent = page.searchIcon;
  document.querySelector('[data-editable="sectionTitle"]').textContent = page.sectionTitle;
  document.querySelector('[data-editable="footer"]').textContent = page.footer;
  $("searchInput").placeholder = page.searchPlaceholder;
}

// --- เรนเดอร์การ์ดสินค้า ---
function renderCards() {
  const q = $("searchInput").value.trim().toLowerCase();
  const filtered = items.filter(x => (x.name + " " + (x.code||"") + " " + (x.tags||[]).join(" ")).toLowerCase().includes(q));
  
  $("count").textContent = `${filtered.length} รายการ`;

  const html = filtered.length ? filtered.map(item => `
    <article class="card" data-id="${item.id}">
      ${item.code ? `<div class="product-code">${esc(item.code)}</div>` : ''}
      <div class="image-wrap">
        ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="image-fallback" style="display:none">❀</div>` : `<div class="image-fallback">❀</div>`}
      </div>
      <div class="card-body">
        <div class="name">${esc(item.name)}</div>
        <div class="tags">${(item.tags||[]).slice(0,3).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <button class="action-btn" data-link="${encodeURIComponent(item.link)}">${esc(page.actionButton)}</button>
      </div>
    </article>
  `).join("") : `<div class="empty">ไม่พบสินค้าที่ค้นหา<br><small>ลองใช้คำค้นหาอื่น</small></div>`;

  $("cardsGrid").innerHTML = html;
}

// --- ระบบคลิกการ์ด (เปิดลิงก์ หรือ แก้ไข) ---
$("cardsGrid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const id = card.dataset.id;
  
  if (adminMode) {
    e.preventDefault();
    openCardModal(id);
    return;
  }

  const btn = e.target.closest(".action-btn");
  if (btn) {
    const url = decodeURIComponent(btn.dataset.link || "");
    if (/^https?:\/\//i.test(url)) window.open(url, "_blank", "noopener,noreferrer");
    else showToast("ลิงก์ปลายทางไม่ถูกต้อง");
  }
});

// --- เปิดหน้าต่างเพิ่ม/แก้ไขการ์ด ---
function openCardModal(id = null) {
  const form = $("cardForm");
  form.reset();
  
  if (id) {
    const item = items.find(x => x.id === id);
    if (item) {
      $("cardModalTitle").textContent = "แก้ไขข้อมูล";
      $("cardId").value = item.id;
      $("cardCode").value = item.code || "";
      $("cardName").value = item.name || "";
      $("cardImage").value = item.image || "";
      $("cardLink").value = item.link || "";
      $("cardTags").value = (item.tags || []).join(" ");
      $("deleteCardBtn").style.display = "block";
    }
  } else {
    $("cardModalTitle").textContent = "เพิ่มสินค้าใหม่";
    $("cardId").value = "";
    $("deleteCardBtn").style.display = "none";
  }
  
  $("cardEditModal").classList.add("show");
}

// --- บันทึกการ์ด ---
$("cardForm").addEventListener("submit", e => {
  e.preventDefault();
  const id = $("cardId").value || uid();
  const tagsStr = $("cardTags").value.replace(/,/g, " ").split(/\s+/).map(t => t.trim()).filter(Boolean).map(t => t.startsWith("#") ? t : "#" + t);
  const tags = [...new Set(tagsStr)];

  const newItem = {
    id,
    code: $("cardCode").value.trim(),
    name: $("cardName").value.trim(),
    image: $("cardImage").value.trim(),
    link: $("cardLink").value.trim(),
    tags
  };

  if ($("cardId").value) {
    items = items.map(x => x.id === id ? newItem : x);
    showToast("อัปเดตข้อมูลแล้ว");
  } else {
    items.unshift(newItem);
    showToast("เพิ่มสินค้าแล้ว");
  }
  
  saveItems(); renderCards(); closeModal('cardEditModal');
});

// --- ลบการ์ด ---
window.deleteCard = function() {
  const id = $("cardId").value;
  if (!id || !confirm("ต้องการลบสินค้านี้ใช่หรือไม่?")) return;
  items = items.filter(x => x.id !== id);
  saveItems(); renderCards(); closeModal('cardEditModal'); showToast("ลบข้อมูลแล้ว");
};

// --- แก้ไขข้อความ In-place ---
document.querySelectorAll("[data-editable]").forEach(el => {
  el.addEventListener("click", () => {
    if (!adminMode) return;
    const key = el.dataset.editable;
    const labels = { eyebrow: "หัวข้อย่อย", title: "หัวข้อหลัก", subtitle: "คำบรรยาย", searchIcon: "ไอคอนค้นหา", sectionTitle: "ชื่อหมวดหมู่", footer: "ส่วนท้าย" };
    currentTextKey = key;
    $("textModalTitle").textContent = "แก้ไข " + (labels[key] || "ข้อความ");
    $("textInput").value = page[key] || "";
    $("textEditModal").classList.add("show");
    setTimeout(() => $("textInput").focus(), 50);
  });
});

$("searchInput").addEventListener("click", e => {
  if (!adminMode) return;
  e.preventDefault(); e.stopPropagation(); $("searchInput").blur();
  currentTextKey = "searchPlaceholder";
  $("textModalTitle").textContent = "แก้ไข ข้อความช่องค้นหา";
  $("textInput").value = page.searchPlaceholder || "";
  $("textEditModal").classList.add("show");
});

$("textEditForm").addEventListener("submit", e => {
  e.preventDefault();
  if (currentTextKey) {
    page[currentTextKey] = $("textInput").value;
    savePage(); applyPageData(); closeModal('textEditModal'); showToast("บันทึกข้อความแล้ว");
  }
});

// --- ระบบ Admin Login พร้อมเปิด-ปิดรหัสผ่าน ---
const ADMIN_PASS = "vapanika3541"; // รหัสผ่านใหม่

$("togglePassword").addEventListener("click", function() {
  const passInput = $("passwordInput");
  if (passInput.type === "password") {
    passInput.type = "text";
    this.textContent = "🙈"; // เปลี่ยนไอคอนเมื่อแสดงรหัส
  } else {
    passInput.type = "password";
    this.textContent = "👁️"; // เปลี่ยนไอคอนเมื่อซ่อนรหัส
  }
});

$("adminToggle").addEventListener("click", () => {
  if (adminMode) {
    adminMode = false;
    $("phone").classList.remove("admin-mode");
    $("adminToggle").textContent = "⚙️";
    showToast("ออกจากระบบผู้ดูแล");
  } else {
    $("passwordInput").value = "";
    $("passwordInput").type = "password"; // รีเซ็ตให้ซ่อนรหัสผ่านเสมอเมื่อเปิดหน้าต่าง
    $("togglePassword").textContent = "👁️";
    $("passwordModal").classList.add("show");
    setTimeout(() => $("passwordInput").focus(), 50);
  }
});

$("passwordForm").addEventListener("submit", e => {
  e.preventDefault();
  if ($("passwordInput").value === ADMIN_PASS) {
    adminMode = true;
    $("phone").classList.add("admin-mode");
    $("adminToggle").textContent = "✓";
    closeModal('passwordModal');
    showToast("เข้าสู่โหมดแก้ไข (คลิกที่ส่วนต่างๆ เพื่อแก้)");
  } else {
    showToast("รหัสผ่านไม่ถูกต้อง");
  }
});

document.querySelectorAll(".modal").forEach(m => {
  m.addEventListener("click", e => { if (e.target === m) closeModal(m.id); });
});

$("searchInput").addEventListener("input", renderCards);

function showToast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(window._to); window._to = setTimeout(() => t.classList.remove("show"), 2000);
}

applyPageData();
renderCards();
</script>
